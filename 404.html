<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not Found — Zach Savage Photography</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://www.zachsavagephotography.ca/404.html" />
    <style>
      :root {
        color-scheme: light;
        --ink: #111;
        --muted: #444;
        --bg: #f4f4f2;
        --accent: #1a1a1a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "DM Sans", "Barlow", system-ui, sans-serif;
        background:
          radial-gradient(120% 80% at 10% 0%, #e8e4dc 0%, transparent 55%),
          radial-gradient(90% 70% at 100% 100%, #d9dde3 0%, transparent 50%),
          var(--bg);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
      }
      main {
        max-width: 34rem;
        width: 100%;
      }
      h1 {
        font-family: "Barlow Condensed", "Montserrat", sans-serif;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: clamp(1.8rem, 5vw, 2.4rem);
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1rem;
        line-height: 1.55;
        color: var(--muted);
      }
      ul {
        margin: 0;
        padding-left: 1.1rem;
        line-height: 1.7;
      }
      a {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>
        That URL is not on Zach Savage Photography. Use one of these recovery
        links:
      </p>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/full-gallery.html">Gallery</a></li>
        <li><a href="/#contact-heading">Contact / booking</a></li>
        <li><a href="/llms.txt">llms.txt</a> (agent guide)</li>
        <li><a href="/sitemap.xml">sitemap.xml</a></li>
        <li><a href="/404.md">404.md</a> (markdown recovery)</li>
      </ul>
    </main>
  </body>
</html>
